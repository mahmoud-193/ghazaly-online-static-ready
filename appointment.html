<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موعد خاص مع المدرس</title><link rel="stylesheet" href="styles.css"></head><body><main class="forms wrap appointment"><div class="form-copy"><p class="eyebrow">موعد خاص مع المدرس</p><h1>محتاج وقت خاص؟<br><em>احجز استفسارك.</em></h1><p>اكتب بياناتك والوقت المناسب، وسيتواصل معك الأستاذ لتأكيد الموعد.</p></div><form class="paper-form" onsubmit="event.preventDefault();const f=new FormData(this);window.open('https://wa.me/201228862963?text='+encodeURIComponent('طلب موعد خاص\nالاسم: '+f.get('name')+'\nالمجموعة: '+f.get('group')+'\nالوقت: '+f.get('slot')+'\nالسبب: '+f.get('reason')),'_blank')"><label>اسم الطالب<input name="name" required placeholder="اكتب اسمك"></label><div class="form-row"><label>المجموعة أو الصف<input name="group" required placeholder="مثال: ثالثة ثانوي"></label><label>اليوم والوقت<input name="slot" required placeholder="مثال: السبت مساءً"></label></div><label>سبب الموعد<textarea name="reason" rows="3" placeholder="اكتب السبب"></textarea></label><button class="button" type="submit">إرسال طلب الموعد ↗</button></form></main></body></html>
